<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#5b2a0a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- stem -->
  <path d="M256 392 C256 340 248 300 256 244" stroke="#f0fdf4" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- left leaf -->
  <path d="M252 270 C196 278 128 246 116 166 C198 154 250 202 252 270 Z" fill="url(#leaf)"/>
  <path d="M244 262 C204 240 170 214 142 182" stroke="#16a34a" stroke-width="7" stroke-linecap="round" fill="none" opacity=".45"/>
  <!-- right leaf -->
  <path d="M260 248 C306 258 388 230 402 124 C298 112 246 172 260 248 Z" fill="url(#leaf)"/>
  <path d="M268 238 C314 206 350 176 380 142" stroke="#16a34a" stroke-width="7" stroke-linecap="round" fill="none" opacity=".45"/>
  <!-- soil mound (drawn last so the stem grows out of it) -->
  <path d="M104 418 C150 360 362 360 408 418 Z" fill="url(#soil)"/>
</svg>
