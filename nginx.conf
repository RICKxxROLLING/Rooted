server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Barcode lookup proxy — UPC Item DB doesn't send CORS headers for other origins
    location /api/upc/ {
        proxy_pass https://api.upcitemdb.com/;
        proxy_set_header Host api.upcitemdb.com;
        proxy_ssl_server_name on;
        proxy_set_header Origin "";
    }

    # Serve the app; fall back to index.html for any path (single-page app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
