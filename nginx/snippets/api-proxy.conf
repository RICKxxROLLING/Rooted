# Shared settings for the outbound API proxies
proxy_http_version 1.1;
proxy_ssl_server_name on;          # send SNI so HTTPS upstreams pick the right certificate
proxy_ssl_verify on;               # verify the upstream's certificate
proxy_ssl_verify_depth 3;          # default of 1 rejects normal leaf → intermediate → root chains
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

# Don't leak visitor details or cookies to third-party APIs
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header Cookie "";
proxy_set_header X-Forwarded-For "";
proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;
