# Included in every location: nginx drops server-level add_header directives
# inside any location that sets its own headers, so they live here instead.

# Only load code/styles/images from this site; API calls go through our own /api proxies.
# data:/blob: images are the plant photos saved in the browser and the barcode scanner.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;                 # no MIME-type guessing
add_header X-Frame-Options "DENY" always;                           # no clickjacking via iframes (older browsers)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Browsers only honour this over HTTPS (i.e. via your reverse proxy); ignored on plain-HTTP LAN access
add_header Strict-Transport-Security "max-age=31536000" always;
