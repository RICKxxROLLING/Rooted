name: Build & Publish Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t garden-tracker:test .

      # Start the image and check nginx config, security headers and API proxies.
      # If anything fails, the image is never published.
      - name: Smoke test
        run: .github/scripts/smoke-test.sh garden-tracker:test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker tag garden-tracker:test ghcr.io/${{ env.OWNER }}/garden-tracker:latest
          docker push ghcr.io/${{ env.OWNER }}/garden-tracker:latest
